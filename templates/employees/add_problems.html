{% extends 'base.html' %}
{% block content %}
    <div>
        <form action="{% url 'add_problem' %}" method="post">
            {% csrf_token %}
            <div class="d-flex flex-column align-content-center">
                {{ form }}
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" id="submitButton">Submit</button>
            </div>
        </form>
    </div>
{% endblock %}
